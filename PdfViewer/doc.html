<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document</title>
<style>
:root{--bg:#1c1c1e;--fg:#e8e8e8;--accent:#d9a85b;--bar:rgba(30,30,32,.94);--barfg:#eee;--fs:19px;--lh:1.9;--colw:760px;--ff:Vazirmatn,"Segoe UI",Tahoma,sans-serif;--muted:rgba(127,127,127,.55);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);}
::-webkit-scrollbar{width:0;height:0;}
#prog{position:fixed;left:0;top:0;height:3px;width:0;background:var(--accent);z-index:9;transition:width .2s;}
#wrap{padding:36px 18px 140px;}
#doc{max-width:var(--colw);margin:0 auto;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);word-wrap:break-word;overflow-wrap:anywhere;text-align:start;}
.ch{margin:0 0 3.2em;}
.ch:last-child{margin-bottom:0;}
#doc p{margin:0 0 .9em;}
#doc h1,#doc h2,#doc h3,#doc h4,#doc h5,#doc h6{line-height:1.45;margin:1.4em 0 .6em;font-weight:700;}
#doc h1{font-size:1.7em;}#doc h2{font-size:1.45em;}#doc h3{font-size:1.25em;}#doc h4{font-size:1.1em;}
#doc img{max-width:100%;height:auto;display:block;margin:1em auto;border-radius:3px;}
#doc a{color:var(--accent);}
#doc blockquote{margin:1em 0;padding:.2em 1em;border-inline-start:4px solid var(--accent);background:rgba(127,127,127,.10);border-radius:4px;}
#doc pre,#doc code{font-family:Consolas,"Courier New",monospace;direction:ltr;text-align:left;}
#doc pre{background:rgba(127,127,127,.14);padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:.82em;line-height:1.6;white-space:pre;}
#doc code{background:rgba(127,127,127,.16);padding:1px 5px;border-radius:4px;font-size:.88em;}
#doc pre code{background:none;padding:0;}
#doc table{border-collapse:collapse;max-width:100%;margin:1em auto;display:block;overflow-x:auto;font-size:.92em;}
#doc td,#doc th{border:1px solid var(--muted);padding:6px 10px;vertical-align:top;}
#doc th{background:rgba(127,127,127,.14);}
#doc hr{border:0;border-top:1px solid var(--muted);margin:1.6em 0;}
#doc ul,#doc ol{padding-inline-start:1.6em;margin:0 0 .9em;}
#doc li{margin:.15em 0;}
body.txt #doc{white-space:pre-wrap;}
body.txt #doc .ch>*{white-space:pre-wrap;}
body.docx #doc table{font-size:.9em;}
.pill{position:fixed;background:var(--bar);color:var(--barfg);border:1px solid rgba(255,255,255,.12);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.45);user-select:none;direction:ltr;z-index:5;}
#bar{left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px 8px;font-size:13px;transition:opacity .25s;max-width:96vw;}
#bar.hide{opacity:0;pointer-events:none;}
#bar button,#sb button{background:transparent;border:0;color:inherit;width:30px;height:30px;border-radius:50%;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;font-family:inherit;font-size:15px;}
#bar button:hover,#sb button:hover{background:rgba(255,255,255,.14);}
#bar button.on{color:var(--accent);}
#bar svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
#bar .sep{width:1px;height:18px;background:rgba(255,255,255,.18);margin:0 4px;flex:none;}
#bar .tx{font-weight:700;font-size:13px;}
#cur{width:48px;text-align:center;background:rgba(255,255,255,.1);border:1px solid transparent;color:inherit;border-radius:8px;height:26px;font-size:13px;font-family:inherit;}
#cur:focus{outline:none;border-color:var(--accent);}
#zoomv{min-width:44px;text-align:center;cursor:pointer;}
#tot{margin-right:4px;opacity:.8;}
#sb{top:12px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:6px;border-radius:12px;padding:6px 8px;font-size:13px;}
#sb input{background:rgba(255,255,255,.1);border:1px solid transparent;color:inherit;border-radius:8px;height:28px;width:220px;padding:0 8px;font-size:13px;font-family:inherit;direction:auto;}
#sb input:focus{outline:none;border-color:var(--accent);}
#scount{min-width:54px;text-align:center;opacity:.8;}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:15px;text-align:center;padding:24px;z-index:10;background:var(--bg);}
#msg{transition:opacity .28s;}.gone{opacity:0;pointer-events:none;}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:sp .9s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
::selection{background:rgba(217,168,91,.45);}
</style>
</head>
<body>
<div id="prog"></div>
<div id="msg"><div class="spin"></div></div>
<div id="wrap"><article id="doc"></article></div>
<div id="sb" class="pill" dir="ltr"><input id="sq" type="text" spellcheck="false"><span id="scount"></span><button id="sprev">&#8593;</button><button id="snext">&#8595;</button><button id="sclose">&#10005;</button></div>
<div id="bar" class="pill" dir="ltr">
  <button id="fout" class="tx">A-</button><span id="zoomv">100%</span><button id="fin" class="tx">A+</button>
  <span class="sep"></span>
  <button id="bwid"><svg viewBox="0 0 24 24"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg></button>
  <button id="blh"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M5 4v16M3 6l2-2 2 2M3 18l2 2 2-2"/></svg></button>
  <button id="bff" class="tx">Aa</button>
  <span class="sep"></span>
  <input id="cur" type="text" inputmode="numeric" value="1"><span id="tot">/ 1</span>
  <span class="sep"></span>
  <button id="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button>
</div>
<script>(function(){
if(window.__fnd){return;}
var BLK={P:1,DIV:1,LI:1,H1:1,H2:1,H3:1,H4:1,H5:1,H6:1,TD:1,TH:1,TR:1,BLOCKQUOTE:1,PRE:1,SECTION:1,ARTICLE:1,BR:1,UL:1,OL:1,TABLE:1,BODY:1,FIGURE:1,FIGCAPTION:1};
var MAP={'ي':'ی','ى':'ی','ے':'ی','ك':'ک','أ':'ا','إ':'ا','آ':'ا','ٱ':'ا','ؤ':'و','ة':'ه','ۀ':'ه','ہ':'ه','ھ':'ه'};
function nc(ch){
  var c=ch.charCodeAt(0);
  if((c>=0x064B&&c<=0x065F)||c===0x0670||c===0x0640||c===0x200C||c===0x200D||c===0x00AD||c===0x200E||c===0x200F||c===0x061C){return '';}
  if(c>=0x06F0&&c<=0x06F9){return String.fromCharCode(c-0x06F0+48);}
  if(c>=0x0660&&c<=0x0669){return String.fromCharCode(c-0x0660+48);}
  if(c===0x00A0||c===0x2009||c===0x202F){return ' ';}
  if(MAP[ch]){return MAP[ch];}
  return ch.toLowerCase();
}
function norm(s){var o='';for(var i=0;i<s.length;i++){o+=nc(s.charAt(i));}return o.replace(/\s+/g,' ').trim();}
var st={q:'',marks:[],cur:-1,root:null};
function blockOf(n){var p=n.parentNode;while(p&&p.nodeType===1&&!BLK[p.tagName]){p=p.parentNode;}return p;}
function clear(){
  var ms=document.querySelectorAll('mark.fnd');
  var ps=[];
  for(var i=0;i<ms.length;i++){var m=ms[i],p=m.parentNode;if(!p){continue;}while(m.firstChild){p.insertBefore(m.firstChild,m);}p.removeChild(m);if(ps.indexOf(p)<0){ps.push(p);}}
  for(var j=0;j<ps.length;j++){try{ps[j].normalize();}catch(e){}}
  st.marks=[];st.cur=-1;
}
function collect(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){var p=n.parentNode;if(!p){return NodeFilter.FILTER_REJECT;}var t=p.tagName;if(t==='SCRIPT'||t==='STYLE'||t==='NOSCRIPT'){return NodeFilter.FILTER_REJECT;}return NodeFilter.FILTER_ACCEPT;}});
  var nodes=[],n;while((n=w.nextNode())){nodes.push(n);}return nodes;
}
function build(root){
  var nodes=collect(root),text='',map=[],lastB=null,k;
  for(var i=0;i<nodes.length;i++){
    var nd=nodes[i],b=blockOf(nd);
    if(b!==lastB&&text.length){text+='\u0001';map.push(null);}
    lastB=b;
    var s=nd.nodeValue;
    for(k=0;k<s.length;k++){
      var c=nc(s.charAt(k));
      for(var z=0;z<c.length;z++){text+=c.charAt(z);map.push(z===0?[i,k]:[i,k]);}
    }
  }
  return {nodes:nodes,text:text,map:map};
}
function run(q,root){
  clear();
  st.q=q;
  var nq=norm(q||'');
  if(!nq){return '0|0';}
  root=root||document.getElementById('doc')||document.body;
  st.root=root;
  var d=build(root),hits=[],from=0,idx;
  while((idx=d.text.indexOf(nq,from))>=0){hits.push(idx);from=idx+Math.max(1,nq.length);if(hits.length>4000){break;}}
  /* per-node segments for each hit, then wrap from the end backwards */
  var segs=[];
  for(var h=0;h<hits.length;h++){
    var a=hits[h],b=hits[h]+nq.length-1,per={},order=[];
    for(var p=a;p<=b;p++){var m=d.map[p];if(!m){continue;}if(!per[m[0]]){per[m[0]]={n:m[0],s:m[1],e:m[1]};order.push(m[0]);}else{if(m[1]>per[m[0]].e){per[m[0]].e=m[1];}if(m[1]<per[m[0]].s){per[m[0]].s=m[1];}}}
    var list=[];for(var o=0;o<order.length;o++){list.push(per[order[o]]);}
    segs.push(list);
  }
  var created=new Array(segs.length);
  for(var hi=segs.length-1;hi>=0;hi--){
    var L=segs[hi],mk=[];
    for(var li=L.length-1;li>=0;li--){
      var sg=L[li],node=d.nodes[sg.n];
      if(!node||!node.parentNode){continue;}
      try{
        var r=document.createRange();r.setStart(node,sg.s);r.setEnd(node,Math.min(node.nodeValue.length,sg.e+1));
        var el=document.createElement('mark');el.className='fnd';r.surroundContents(el);mk.unshift(el);
      }catch(e){}
    }
    created[hi]=mk;
  }
  /* flatten: one entry per hit (first mark), keep all marks for current highlight */
  st.marks=[];
  for(var i2=0;i2<created.length;i2++){if(created[i2]&&created[i2].length){st.marks.push(created[i2]);}}
  if(!st.marks.length){return '0|0';}
  /* start from the first hit at/below the viewport top */
  var top=0,start=0;
  for(var s2=0;s2<st.marks.length;s2++){if(st.marks[s2][0].getBoundingClientRect().top>=top-2){start=s2;break;}}
  setCur(start,true);
  return (st.cur+1)+'|'+st.marks.length;
}
function setCur(i,scroll){
  if(st.cur>=0&&st.marks[st.cur]){for(var a=0;a<st.marks[st.cur].length;a++){st.marks[st.cur][a].className='fnd';}}
  st.cur=i;
  var mk=st.marks[i];if(!mk){return;}
  for(var b=0;b<mk.length;b++){mk[b].className='fnd fnd-cur';}
  if(scroll){try{mk[0].scrollIntoView({block:'center',behavior:'auto'});}catch(e){}}
}
function step(dir){
  var n=st.marks.length;if(!n){return '0|0|';}
  var nx=st.cur+dir,edge='';
  if(nx>=n){nx=0;edge='e';}else if(nx<0){nx=n-1;edge='s';}
  setCur(nx,true);
  return (st.cur+1)+'|'+n+'|'+edge;
}
function info(){return (st.cur+1)+'|'+st.marks.length;}
var css=document.createElement('style');
css.textContent='mark.fnd{background:rgba(227,184,95,.38)!important;color:inherit!important;border-radius:3px;padding:0;}mark.fnd.fnd-cur{background:#e3b85f!important;color:#1a1608!important;box-shadow:0 0 0 2px rgba(227,184,95,.55);}';
(document.head||document.documentElement).appendChild(css);
window.__fnd={run:run,step:step,clear:clear,info:info,norm:norm};
})();
</script>
<script>
(function(){
  var Q={};location.search.replace(/^\?/,'').split('&').forEach(function(kv){if(!kv)return;var i=kv.indexOf('=');var k=i<0?kv:kv.substr(0,i);Q[k]=decodeURIComponent((i<0?'':kv.substr(i+1)).replace(/\+/g,' '));});
  function post(m){try{window.chrome.webview.postMessage(m);}catch(x){}}
  function $(id){return document.getElementById(id);}
  var root=document.documentElement,body=document.body,docEl=$('doc'),msg=$('msg'),bar=$('bar'),cur=$('cur'),tot=$('tot'),zoomv=$('zoomv'),prog=$('prog');
  var kind=Q.kind||'txt';body.classList.add(kind);
  var TL={};try{TL=JSON.parse(Q.tl||'{}');}catch(e){}
  function t(k,d){return TL[k]||d;}
  var tips={fout:t('zout','Smaller text'),fin:t('zin','Larger text'),bwid:t('width','Column width'),blh:t('lh','Line spacing'),bff:t('ff','Serif / sans'),find:t('find','Search (Ctrl+F)'),sclose:'Esc'};
  Object.keys(tips).forEach(function(k){$(k).title=tips[k];});
  $('sq').placeholder=t('search','Search');
  function store(k,v){try{if(v===undefined){return localStorage.getItem(k);}localStorage.setItem(k,v);}catch(e){return null;}}
  var D={c:[]};try{D=JSON.parse(Q.d||'{}');}catch(e){}
  var base=Q.base||'https://comicdoc.local/';
  var fs=1,wid=parseInt(store('docWid'),10),lhI=parseInt(store('docLh'),10),serif=store('docSerif')==='1';
  var WIDS=[kind==='docx'?640:560,kind==='docx'?820:760,kind==='docx'?1000:980],LHS=[1.6,1.9,2.2];
  if(!(wid>=0&&wid<3))wid=1;if(!(lhI>=0&&lhI<3))lhI=1;
  var qz=parseFloat(Q.zoom),sz=parseFloat(store('docFs'));
  if(sz>0.6&&sz<2.3)fs=sz;if(qz>0.6&&qz<2.3)fs=qz;
  var total=1,chapEls=[],chapPages=[],moved=false,ready=false;

  function setTheme(bg,fg){root.style.setProperty('--bg',bg);root.style.setProperty('--fg',fg);}
  window.__pdfTheme=function(bg,fg){setTheme(bg,fg);};
  if(Q.bg)setTheme(Q.bg,Q.fg||'#eee');
  function applyStyle(){
    root.style.setProperty('--fs',(19*fs).toFixed(1)+'px');
    root.style.setProperty('--lh',String(LHS[lhI]));
    root.style.setProperty('--colw',WIDS[wid]+'px');
    root.style.setProperty('--ff',serif?'Georgia,"Times New Roman",Vazirmatn,"Segoe UI",serif':'Vazirmatn,"Segoe UI",Tahoma,sans-serif');
    zoomv.textContent=Math.round(fs*100)+'%';
    $('bff').textContent=serif?'Aa':'Aa';$('bff').style.fontFamily=serif?'Georgia,serif':'inherit';
  }
  applyStyle();

  /* position model: virtual pages (~1800 characters each) so progress & XP are stable across font sizes */
  function docH(){return Math.max(1,body.scrollHeight||root.scrollHeight);}
  function curTop(){return root.scrollTop||body.scrollTop||0;}
  function pageFromScroll(){var f=curTop()/Math.max(1,docH()-(root.clientHeight||innerHeight));if(f<0)f=0;if(f>1)f=1;return Math.min(total,Math.floor(f*total+0.0001)+1);}
  function scrollForPage(n){var maxS=Math.max(0,docH()-(root.clientHeight||innerHeight));return Math.max(0,Math.min(maxS,((n-1)/total)*maxS));}
  function goto(n,smooth){
    n=Math.max(1,Math.min(total,n|0));
    var y=scrollForPage(n);
    for(var i=0;i<chapPages.length;i++){if(chapPages[i]===n&&chapEls[i]){y=chapEls[i].getBoundingClientRect().top+curTop()-16;break;}}
    if(smooth){root.scrollTo({top:y,behavior:'smooth'});}else{root.scrollTop=y;body.scrollTop=y;}
  }
  window.__pdfGoto=function(n){moved=true;goto(n,false);};
  function step(dir){moved=true;root.scrollTo({top:curTop()+dir*(innerHeight||root.clientHeight)*0.88,behavior:'smooth'});}
  window.__pdfStep=step;
  window.__pdfSearch=function(){openSearch();};
  var lastPosted=-1,lt=-1,lh=-1,lc=-1,curPage=1;
  function updateIndicators(){
    if(document.activeElement!==cur)cur.value=curPage;
    var maxS=Math.max(1,docH()-(root.clientHeight||innerHeight));
    prog.style.width=Math.min(100,100*curTop()/maxS)+'%';
    if(curPage!==lastPosted){lastPosted=curPage;post('pp|'+curPage+'|'+total);}
  }
  function onScroll(){
    if(!ready)return;
    var tp=Math.round(curTop()),h=Math.round(docH()),c=root.clientHeight||0;
    if(tp!=lt||h!=lh||c!=lc){lt=tp;lh=h;lc=c;post('s|'+tp+'|'+h+'|'+c);}
    curPage=pageFromScroll();updateIndicators();
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  setInterval(onScroll,300);

  /* settings */
  function keepAnchor(fn){var f=ready?curTop()/docH():0;fn();if(ready){var y=f*docH();root.scrollTop=y;body.scrollTop=y;}}
  function setFs(v){v=Math.max(0.6,Math.min(2.2,v));if(Math.abs(v-fs)<0.001)return;keepAnchor(function(){fs=v;store('docFs',String(v));post('z|'+v.toFixed(2));applyStyle();});}
  window.__pdfZoomBy=function(d){setFs(fs+d);};
  window.__pdfFit=function(){setFs(1);};
  $('fin').onclick=function(){setFs(fs+0.1);};$('fout').onclick=function(){setFs(fs-0.1);};zoomv.onclick=function(){setFs(1);};
  $('bwid').onclick=function(){keepAnchor(function(){wid=(wid+1)%3;store('docWid',String(wid));applyStyle();});};
  $('blh').onclick=function(){keepAnchor(function(){lhI=(lhI+1)%3;store('docLh',String(lhI));applyStyle();});};
  $('bff').onclick=function(){keepAnchor(function(){serif=!serif;store('docSerif',serif?'1':'0');applyStyle();});};

  /* search (native find: selects + scrolls to each hit) */
  var sb=$('sb'),sq=$('sq'),scount=$('scount'),lastQ='';
  function openSearch(){sb.style.display='flex';sq.focus();sq.select();}
  function showInfo(r){var p=String(r).split('|');if(!p[1]||p[1]==='0'){scount.textContent=sq.value?t('none','Not found'):'';return;}scount.textContent=p[0]+' / '+p[1];}
  function closeSearch(){sb.style.display='none';lastQ='';scount.textContent='';try{window.__fnd.clear();}catch(e){}}
  function doFind(back){
    var q=sq.value;if(!q){try{window.__fnd.clear();}catch(e){}scount.textContent='';lastQ='';return;}
    moved=true;
    if(q!==lastQ){lastQ=q;showInfo(window.__fnd.run(q,$('doc')));return;}
    showInfo(window.__fnd.step(back?-1:1));
  }
  var sT=null;sq.addEventListener('input',function(){clearTimeout(sT);sT=setTimeout(function(){lastQ='';doFind(false);},220);});
  $('find').onclick=openSearch;$('sclose').onclick=closeSearch;
  $('snext').onclick=function(){doFind(false);};$('sprev').onclick=function(){doFind(true);};
  sq.addEventListener('keydown',function(e){e.stopPropagation();if(e.keyCode===13){clearTimeout(sT);doFind(e.shiftKey);}else if(e.keyCode===27){closeSearch();}});
  cur.addEventListener('keydown',function(e){e.stopPropagation();if(e.keyCode===13){var v=parseInt(cur.value,10);if(v>0){moved=true;goto(v);}cur.blur();}else if(e.keyCode===27){cur.blur();}});
  cur.addEventListener('focus',function(){cur.select();});

  var hideT=null;function showBar(){bar.classList.remove('hide');clearTimeout(hideT);hideT=setTimeout(function(){if(document.activeElement!==cur)bar.classList.add('hide');},2800);}
  window.addEventListener('mousemove',showBar);window.addEventListener('mousedown',function(){moved=true;showBar();});window.addEventListener('scroll',showBar,{passive:true});showBar();
  window.addEventListener('wheel',function(e){moved=true;if(e.ctrlKey){e.preventDefault();setFs(fs+(e.deltaY<0?0.1:-0.1));}},{passive:false});
  window.addEventListener('resize',function(){onScroll();});

  document.addEventListener('keydown',function(e){
    var k=e.keyCode;
    if(k===27&&sb.style.display==='flex'){e.preventDefault();closeSearch();return;}
    if(k===27||k===122){e.preventDefault();post('k|'+k);return;}
    if(k===16||k===17||k===18)return;
    var cc=e.ctrlKey?1:0,ss=e.shiftKey?1:0,aa=e.altKey?1:0;
    moved=true;
    if(cc&&k===70){e.preventDefault();openSearch();return;}
    if(cc&&k===67){return;}
    if(cc&&(k===187||k===107)){e.preventDefault();setFs(fs+0.1);return;}
    if(cc&&(k===189||k===109)){e.preventDefault();setFs(fs-0.1);return;}
    if(cc&&(k===48||k===96)){e.preventDefault();setFs(1);return;}
    if(window.__rdrKeys&&window.__rdrKeys[k+':'+cc+ss+aa]){e.preventDefault();post('c|'+k+'|'+cc+'|'+ss+'|'+aa);return;}
    if(cc||aa)return;
    if(k===36){e.preventDefault();root.scrollTo({top:0});}else if(k===35){e.preventDefault();root.scrollTo({top:docH()});}
    else if(k===34||(k===32&&!ss)){e.preventDefault();step(1);}
    else if(k===33||(k===32&&ss)){e.preventDefault();step(-1);}
  },true);

  /* load chapters (the converted book's XHTML) into one continuous document */
function hideMsg(d){setTimeout(function(){msg.classList.add('gone');setTimeout(function(){msg.style.display='none';},320);},d);}
  function fetchText(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();});}
  function importChapter(c,html,url){
    var doc=new DOMParser().parseFromString(html,'text/html');
    var sec=document.createElement('section');sec.className='ch';
    var nodes=doc.body?Array.prototype.slice.call(doc.body.childNodes):[];
    nodes.forEach(function(n){sec.appendChild(document.importNode(n,true));});
    var bad=sec.querySelectorAll('script,style,link,iframe,object,embed,meta,base');for(var i=0;i<bad.length;i++){bad[i].parentNode.removeChild(bad[i]);}
    var imgs=sec.querySelectorAll('img');
    for(var j=0;j<imgs.length;j++){var s=imgs[j].getAttribute('src');if(s){try{imgs[j].src=new URL(s,url).href;}catch(e){}}imgs[j].loading='lazy';imgs[j].onload=function(){if(ready&&!moved)restore();};}
    var el=sec.querySelectorAll('p,li,h1,h2,h3,h4,h5,h6,blockquote,td,th,div');for(var k=0;k<el.length;k++){if(!el[k].hasAttribute('dir'))el[k].setAttribute('dir','auto');}
    var as=sec.querySelectorAll('a');for(var m=0;m<as.length;m++){as[m].removeAttribute('target');as[m].addEventListener('click',function(ev){ev.preventDefault();});}
    return sec;
  }
  var startFrac=0;
  function restore(){if(startFrac>0){var maxS=Math.max(0,docH()-(root.clientHeight||innerHeight));var y=Math.min(maxS,startFrac*maxS);root.scrollTop=y;body.scrollTop=y;}}
  function start(){
    var list=D.c||[];
    if(!list.length){msg.innerHTML='<div>'+(Q.terr||'Empty')+'</div>';return;}
    var secs=new Array(list.length),done=0,idx=0,running=0;
    function finish(){
      var weight=0;
      list.forEach(function(c,i){var s=secs[i];if(!s)return;docEl.appendChild(s);chapEls.push(s);weight+=(s.textContent||'').length+800*s.querySelectorAll('img').length;});
      total=Math.max(1,Math.ceil(weight/1800));tot.textContent='/ '+total;
      ready=true;
      var startPage=Math.min(total,Math.max(1,parseInt(Q.page,10)||1));
      startFrac=startPage>1?(startPage-1)/total:0;
      restore();hideMsg(startPage>1?650:150);setTimeout(function(){if(!moved)restore();},500);setTimeout(function(){if(!moved)restore();},1500);
      // chapter -> virtual page (outline)
      var maxS=Math.max(1,docH()-(root.clientHeight||innerHeight)),out=[];
      chapEls.forEach(function(el,i){
        var top=el.getBoundingClientRect().top+curTop();
        var p=Math.min(total,Math.floor(Math.min(1,top/maxS)*total+0.0001)+1);chapPages.push(p);
        var title=list[i]&&list[i].t?String(list[i].t):'';if(title&&!/^(\u0641\u0635\u0644|\u0628\u062e\u0634|chapter|section)\s*\d+$/i.test(title.trim()))out.push({t:title.slice(0,120),p:p,d:0});
      });
      post('n|'+total);
      if(out.length>1)post('o|'+encodeURIComponent(JSON.stringify(out)));
      onScroll();
    }
    function next(){
      while(running<4&&idx<list.length){
        (function(i){
          running++;var u=base+list[i].f;
          fetchText(u).then(function(h){secs[i]=importChapter(list[i],h,u);}).catch(function(){}).then(function(){running--;done++;if(done===list.length){finish();}else{next();}});
        })(idx++);
      }
    }
    next();
  }
  start();
})();
</script>
