<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF</title>
<style>
:root{--bg:#1c1c1e;--fg:#e8e8e8;--accent:#d9a85b;--bar:rgba(30,30,32,.94);--barfg:#eee;--gap:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:Tahoma,"Segoe UI",sans-serif;overflow-x:auto;}
::-webkit-scrollbar{width:0;height:0;}
#prog{position:fixed;left:0;top:0;height:3px;width:0;background:var(--accent);z-index:9;transition:width .2s;}
#stage{display:flex;min-height:100vh;}
#pages{flex:1 1 auto;display:flex;flex-direction:column;align-items:flex-start;padding:18px 0 96px 0;gap:var(--gap);min-width:0;}
body.paged #pages{flex-direction:row;align-items:center;justify-content:center;gap:0;padding:12px;min-height:100vh;}
.page{margin:0 auto;position:relative;background:var(--bg);box-shadow:0 2px 14px rgba(0,0,0,.35);border-radius:2px;flex:none;overflow:hidden;}
body.paged .page{margin:0;border-radius:0;}
body.paged .page.off{display:none;}
.page canvas{display:block;position:absolute;left:0;top:0;width:100%;height:100%;}
body.mode-light .page:not(.photo) canvas{mix-blend-mode:multiply;}
body.mode-dark .page:not(.photo) canvas{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen;}
.page .num{position:absolute;right:8px;top:6px;font-size:11px;opacity:.35;pointer-events:none;}
.page .bm{position:absolute;left:10px;top:0;width:16px;height:26px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);display:none;z-index:3;}
.page.marked .bm{display:block;}
.hlayer{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;}
.hlr{position:absolute;pointer-events:auto;cursor:pointer;border-radius:2px;}
.textLayer{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;line-height:1;}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%;}
.textLayer ::selection{background:rgba(217,168,91,.45);}
.textLayer span.hl{background:rgba(255,213,74,.55);border-radius:2px;}
.textLayer span.hl.cur{background:rgba(255,140,0,.75);}
.pill{position:fixed;background:var(--bar);color:var(--barfg);border:1px solid rgba(255,255,255,.12);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.45);user-select:none;direction:ltr;z-index:5;}
#bar{left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px 8px;font-size:13px;transition:opacity .25s;max-width:96vw;}
#bar.hide{opacity:0;pointer-events:none;}
#bar button,#sb button,#sel button{background:transparent;border:0;color:inherit;width:30px;height:30px;border-radius:50%;font-size:15px;line-height:1;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;padding:0;}
#bar button:hover,#sb button:hover,#sel button:hover{background:rgba(255,255,255,.14);}
#bar button.on{color:var(--accent);}
#bar svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
#bar .sep{width:1px;height:18px;background:rgba(255,255,255,.18);margin:0 4px;flex:none;}
#cur{width:48px;text-align:center;background:rgba(255,255,255,.1);border:1px solid transparent;color:inherit;border-radius:8px;height:26px;font-size:13px;font-family:inherit;}
#cur:focus{outline:none;border-color:var(--accent);}
#zoomv{min-width:44px;text-align:center;cursor:pointer;}
#tot{margin-right:4px;opacity:.8;}
#sb{top:12px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:6px;border-radius:12px;padding:6px 8px;font-size:13px;}
#sb input{background:rgba(255,255,255,.1);border:1px solid transparent;color:inherit;border-radius:8px;height:28px;width:220px;padding:0 8px;font-size:13px;font-family:inherit;direction:auto;}
#sb input:focus{outline:none;border-color:var(--accent);}
#scount{min-width:54px;text-align:center;opacity:.8;}
#sel{display:none;gap:4px;padding:4px 8px;align-items:center;border-radius:12px;z-index:7;}
#sel .dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.5);cursor:pointer;display:inline-block;margin:0 2px;}
#sel .dot:hover{transform:scale(1.15);}
#sel button{width:auto;border-radius:8px;padding:0 8px;height:26px;font-size:12px;}
#thumbs{position:fixed;left:0;top:0;bottom:0;width:132px;background:var(--bar);border-right:1px solid rgba(255,255,255,.1);overflow-y:auto;padding:10px 8px 90px;display:none;z-index:4;}
body.th #thumbs{display:block;}
body.th #stage{margin-left:132px;}
.th-i{position:relative;margin:0 auto 12px;cursor:pointer;border:2px solid transparent;border-radius:4px;background:#fff2;overflow:hidden;}
.th-i.cur{border-color:var(--accent);}
.th-i canvas{display:block;width:100%;height:100%;}
.th-i .n{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:11px;padding:2px 0;background:rgba(0,0,0,.55);color:#fff;}
.th-i .s{position:absolute;right:3px;top:2px;color:var(--accent);font-size:14px;display:none;}
.th-i.marked .s{display:block;}
#msg{transition:opacity .28s;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:15px;text-align:center;padding:24px;z-index:10;background:var(--bg);}
#msg input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:8px;padding:8px 12px;font-size:15px;text-align:center;width:240px;font-family:inherit;}
#msg button{background:var(--accent);color:#1b1b1b;border:0;border-radius:8px;padding:8px 22px;font-size:14px;cursor:pointer;font-family:inherit;}
.gone{opacity:0;pointer-events:none;}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:sp .9s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body class="mode-dark">
<div id="prog"></div>
<div id="msg"><div class="spin"></div><div id="msgt"></div></div>
<div id="thumbs"></div>
<div id="stage"><div id="pages"></div></div>
<div id="sb" class="pill" dir="ltr"><input id="sq" type="text" spellcheck="false"><span id="scount"></span><button id="sprev">&#8593;</button><button id="snext">&#8595;</button><button id="sclose">&#10005;</button></div>
<div id="sel" class="pill"><span id="hlcols"></span><button id="hlcopy"></button><button id="hldel" style="display:none"></button></div>
<div id="bar" class="pill" dir="ltr">
  <button id="bthumb"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
  <span class="sep"></span>
  <button id="zout"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><span id="zoomv">100%</span><button id="zin"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
  <button id="bfit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <span class="sep"></span>
  <button id="bview"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></button>
  <button id="brtl"><svg viewBox="0 0 24 24"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></button>
  <button id="brot"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg></button>
  <span class="sep"></span>
  <input id="cur" type="text" inputmode="numeric" value="1"><span id="tot">/ 1</span>
  <button id="bbm"><svg viewBox="0 0 24 24"><path d="M7 3h10v18l-5-4-5 4z"/></svg></button>
  <span class="sep"></span>
  <button id="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button>
  <button id="inv"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
</div>
<script src="pdf.min.js"></script>
<script>
(function(){
  var Q={};location.search.replace(/^\?/,'').split('&').forEach(function(kv){if(!kv)return;var i=kv.indexOf('=');var k=i<0?kv:kv.substr(0,i);Q[k]=decodeURIComponent((i<0?'':kv.substr(i+1)).replace(/\+/g,' '));});
  function post(m){try{window.chrome.webview.postMessage(m);}catch(x){}}
  function $(id){return document.getElementById(id);}
  var root=document.documentElement,body=document.body;
  var pagesEl=$('pages'),msg=$('msg'),msgt=$('msgt'),bar=$('bar'),cur=$('cur'),tot=$('tot'),zoomv=$('zoomv'),invBtn=$('inv'),prog=$('prog'),thumbsEl=$('thumbs');
  var TL={};try{TL=JSON.parse(Q.tl||'{}');}catch(e){}
  function t(k,d){return TL[k]||d;}
  var T={search:Q.tsearch||t('search','Search'),none:Q.tnone||t('none','Not found'),wrong:Q.twrong||'Wrong password',pw:Q.tpw||'Password',ok:Q.tok||'OK',err:Q.terr||'Could not open this PDF',load:Q.tload||'',dark:Q.tdark||t('look','Appearance')};
  msgt.textContent=T.load;
  var tips={bthumb:t('thumbs','Pages (T)'),zout:t('zout','Zoom out'),zin:t('zin','Zoom in'),bfit:t('fit','Fit width / page'),bview:t('view','Reading mode'),brtl:t('rtl','Right-to-left order'),brot:t('rot','Rotate (R)'),bbm:t('bm','Bookmark (B)'),find:t('find','Search (Ctrl+F)'),inv:T.dark,sclose:'Esc'};
  Object.keys(tips).forEach(function(k){$(k).title=tips[k];});
  $('sq').placeholder=T.search;$('hlcopy').textContent=t('copy','Copy');$('hldel').textContent=t('del','Remove');

  var pdf=null,total=0,pageEls=[],baseW=0,baseH=0,userZoom=1,invertOn=true,isDark=Q.dark==='1';
  var queue=[],active=0,curPage=1,fp='x';
  var dpr=Math.min(2,window.devicePixelRatio||1),MAX_CANVAS=14,layT=null;
  var mode='scroll',fitMode='width',rtl=false,rot=0,coverAlone=true;
  var views=[],curView=0;

  function store(k,v){try{if(v===undefined){return localStorage.getItem(k);}localStorage.setItem(k,v);}catch(e){return null;}}

  /* theme */
  function applyMode(){body.classList.remove('mode-dark','mode-light');body.classList.add((isDark&&invertOn)?'mode-dark':'mode-light');invBtn.className=invertOn?'on':'';}
  function setTheme(bg,fg,dark){root.style.setProperty('--bg',bg);root.style.setProperty('--fg',fg);isDark=!!dark;applyMode();}
  window.__pdfTheme=function(bg,fg,dark){setTheme(bg,fg,dark==1||dark===true);};
  if(store('pdfInvert')==='0')invertOn=false;
  if(Q.bg){setTheme(Q.bg,Q.fg||'#eee',isDark);}else{applyMode();}
  var sz=parseFloat(store('pdfZoom'));if(sz>0.3&&sz<5)userZoom=sz;
  var qz=parseFloat(Q.zoom);if(qz>0.3&&qz<5)userZoom=qz;
  mode=store('pdfMode')||'scroll';if(['scroll','single','spread'].indexOf(mode)<0)mode='scroll';
  fitMode=store('pdfFit')||'width';rtl=store('pdfRtl')==='1';rot=parseInt(store('pdfRot'),10)||0;

  /* geometry */
  function availW(){return Math.max(280,(root.clientWidth||innerWidth)-(body.classList.contains('th')?132:0)-24);}
  function availH(){return Math.max(240,(innerHeight||root.clientHeight)-24);}
  function pageDims(el){var w=el._w||baseW,h=el._h||baseH;return (rot%180)?{w:h,h:w}:{w:w,h:h};}
  function viewPages(v){return views[v]||[];}
  function scaleFor(el){
    var d=pageDims(el);
    if(mode==='scroll'){return (Math.min(availW(),1200)*userZoom)/d.w;}
    var pages=viewPages(curView),totalW=0,maxH=0;
    pages.forEach(function(n){var dd=pageDims(pageEls[n-1]);totalW+=dd.w;if(dd.h>maxH)maxH=dd.h;});
    totalW=Math.max(totalW,1);maxH=Math.max(maxH,1);
    var sW=availW()/totalW,sH=availH()/maxH;
    var base=(fitMode==='page')?Math.min(sW,sH):sW;
    return base*userZoom;
  }
  function buildViews(){
    views=[];
    if(mode==='spread'){
      var i=1;
      if(coverAlone&&total>0){views.push([1]);i=2;}
      for(;i<=total;i+=2){views.push(i+1<=total?[i,i+1]:[i]);}
    }else{for(var n=1;n<=total;n++)views.push([n]);}
  }
  function viewOf(n){for(var v=0;v<views.length;v++){if(views[v].indexOf(n)>=0)return v;}return 0;}

  function layout(){
    if(!pageEls.length)return;
    body.classList.toggle('paged',mode!=='scroll');
    if(mode!=='scroll'){
      var shown=viewPages(curView);
      pageEls.forEach(function(el){el.classList.toggle('off',shown.indexOf(el._n)<0);});
      var ordered=shown.slice();if(mode==='spread'&&rtl)ordered.reverse();
      ordered.forEach(function(n){pagesEl.appendChild(pageEls[n-1]);});
    }else{pageEls.forEach(function(el){el.classList.remove('off');pagesEl.appendChild(el);});}
    pageEls.forEach(function(el){
      if(mode!=='scroll'&&el.classList.contains('off'))return;
      var s=scaleFor(el),d=pageDims(el);
      el.style.width=Math.round(d.w*s)+'px';el.style.height=Math.round(d.h*s)+'px';
      if(el._rendered){el._rendered=false;el._stale=true;}
    });
    zoomv.textContent=Math.round(userZoom*100)+'%';
    clearTimeout(layT);layT=setTimeout(function(){wantVisible();kick();},mode==='scroll'?140:30);
  }

  /* rendering */
  var io=null;
  function setupObserver(){
    if(io){io.disconnect();io=null;}
    if(mode!=='scroll')return;
    io=new IntersectionObserver(function(entries){
      entries.forEach(function(en){var el=en.target;if(en.isIntersecting){el._vis=true;enqueue(el);}else{el._vis=false;release(el);}});
    },{root:null,rootMargin:'1400px 0px 1400px 0px',threshold:0});
    pageEls.forEach(function(el){io.observe(el);});
  }
  function dropCanvas(el){
    var c=el.querySelector('canvas');if(c){c.width=1;c.height=1;el.removeChild(c);}
    var tl=el.querySelector('.textLayer');if(tl)el.removeChild(tl);
    var hl=el.querySelector('.hlayer');if(hl)el.removeChild(hl);
    el._rendered=false;el._stale=false;el._tdivs=null;
  }
  function wantVisible(){
    if(mode==='scroll')return;
    var want=[];[curView,curView+1,curView-1].forEach(function(v){if(views[v])viewPages(v).forEach(function(n){want.push(n);});});
    pageEls.forEach(function(el){if(want.indexOf(el._n)>=0){enqueue(el);}else if(Math.abs(el._n-curPage)>3){release(el);}});
  }
  function enqueue(el){if(el._rendered&&!el._stale)return;if(queue.indexOf(el)<0)queue.push(el);kick();}
  function release(el){
    var i=queue.indexOf(el);if(i>=0)queue.splice(i,1);
    var far=Math.abs(el._n-curPage)>(mode==='scroll'?12:3);
    if(el._task&&far){try{el._task.cancel();}catch(e){}el._task=null;}
    if(far&&el.querySelector('canvas'))dropCanvas(el);
  }
  function evict(){
    var live=[];for(var i=0;i<pageEls.length;i++){if(pageEls[i]._rendered)live.push(pageEls[i]);}
    if(live.length<=MAX_CANVAS)return;
    live.sort(function(a,b){return Math.abs(b._n-curPage)-Math.abs(a._n-curPage);});
    for(var j=0;j<live.length-MAX_CANVAS;j++){if(Math.abs(live[j]._n-curPage)<=2)continue;dropCanvas(live[j]);}
  }
  function kick(){
    if(active>=2)return;
    queue.sort(function(a,b){return Math.abs(a._n-curPage)-Math.abs(b._n-curPage);});
    var el=queue.shift();if(!el)return;
    active++;
    renderPage(el).then(function(){active--;kick();},function(){active--;kick();});
    kick();
  }
  // pages made of pictures (comics, scans, photos) keep their real colours: no tint, no inversion
  function isPhoto(canvas){
    try{
      var w=48,h=48,c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
      x.drawImage(canvas,0,0,w,h);var d=x.getImageData(0,0,w,h).data;var mid=0,n=w*h;
      for(var i=0;i<d.length;i+=4){var l=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])/255;if(l>0.1&&l<0.88)mid++;}
      return mid/n>0.30;
    }catch(e){return false;}
  }
  function renderPage(el){
    var n=el._n;
    return pdf.getPage(n).then(function(page){
      var v1=page.getViewport({scale:1,rotation:0});
      if(!el._w||Math.abs(el._w-v1.width)>1||Math.abs(el._h-v1.height)>1){el._w=v1.width;el._h=v1.height;}
      var s=scaleFor(el),d=pageDims(el);
      var cssW=Math.round(d.w*s),cssH=Math.round(d.h*s);
      el.style.width=cssW+'px';el.style.height=cssH+'px';
      var q=Math.min(dpr,Math.sqrt(16000000/Math.max(1,cssW*cssH)));if(q<1)q=1;
      var rotation=(page.rotate+rot)%360;
      var vp=page.getViewport({scale:s*q,rotation:rotation});
      var canvas=document.createElement('canvas');canvas.width=Math.floor(vp.width);canvas.height=Math.floor(vp.height);
      var ctx=canvas.getContext('2d',{alpha:false});
      ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
      var rt=page.render({canvasContext:ctx,viewport:vp});el._task=rt;
      return rt.promise.then(function(){
        el._task=null;
        var old=el.querySelector('canvas');if(old)el.removeChild(old);
        var oldT=el.querySelector('.textLayer');if(oldT)el.removeChild(oldT);
        el.insertBefore(canvas,el.firstChild);
        el.classList.toggle('photo',isPhoto(canvas));
        el._rendered=true;el._stale=false;
        if(!firstPaint&&Math.abs(n-curPage)<=1){firstPaint=true;tryReveal();}
        evict();drawHighlights(el);
        try{
          var tl=document.createElement('div');tl.className='textLayer';el.appendChild(tl);
          var vpt=page.getViewport({scale:s,rotation:rotation});
          tl.style.width=cssW+'px';tl.style.height=cssH+'px';tl.style.setProperty('--scale-factor',String(s));
          page.getTextContent().then(function(tc){
            try{
              var tdivs=[];el._tdivs=tdivs;
              var task=pdfjsLib.renderTextLayer({textContentSource:tc,container:tl,viewport:vpt,textDivs:tdivs});
              if(task&&task.promise){task.promise.then(function(){applyHl(el);},function(){});}
            }catch(e){}
          }).catch(function(){});
        }catch(e){}
        page.cleanup();
      });
    }).catch(function(){});
  }

  /* navigation */
  function pageTop(n){var el=pageEls[n-1];if(!el)return 0;return el.getBoundingClientRect().top+(window.pageYOffset||root.scrollTop||0);}
  function goto(n,smooth){
    n=Math.max(1,Math.min(total,n|0));
    if(mode==='scroll'){var y=pageTop(n)-10;if(smooth){root.scrollTo({top:y,behavior:'smooth'});}else{root.scrollTop=y;body.scrollTop=y;}return;}
    var v=viewOf(n);
    if(v!==curView){curView=v;curPage=viewPages(v)[0];layout();}
    curPage=n;
    root.scrollTop=0;body.scrollTop=0;root.scrollLeft=0;
    updateIndicators();
  }
  window.__pdfGoto=function(n){goto(n,false);};
  function step(dir){
    if(mode==='scroll'){var h=(innerHeight||root.clientHeight)*0.9;root.scrollTo({top:(root.scrollTop||0)+dir*h,behavior:'smooth'});return;}
    var v=curView+dir;if(v<0||v>=views.length)return;
    curView=v;curPage=viewPages(v)[0];layout();root.scrollTop=0;root.scrollLeft=0;updateIndicators();
  }
  window.__pdfStep=step;
  var lastPosted=-1,lt=-1,lh=-1,lc=-1;
  function currentPageFromScroll(){
    var mid=(window.innerHeight||root.clientHeight)*0.35;
    var lo=0,hi=pageEls.length-1,ans=0;
    while(lo<=hi){var m=(lo+hi)>>1;var r=pageEls[m].getBoundingClientRect();if(r.top<=mid){ans=m;lo=m+1;}else{hi=m-1;}}
    return ans+1;
  }
  function updateIndicators(){
    if(document.activeElement!==cur)cur.value=curPage;
    prog.style.width=(total>1?(100*(curPage-1)/(total-1)):100)+'%';
    $('bbm').className=isMarked(curPage)?'on':'';
    var old=thumbsEl.querySelector('.th-i.cur');if(old)old.classList.remove('cur');
    var th=thumbsEl.querySelector('[data-n="'+curPage+'"]');
    if(th){th.classList.add('cur');if(body.classList.contains('th')){var tr=th.offsetTop-thumbsEl.scrollTop;if(tr<0||tr>thumbsEl.clientHeight-120)thumbsEl.scrollTop=th.offsetTop-80;}}
    if(curPage!==lastPosted){lastPosted=curPage;post('pp|'+curPage+'|'+total);}
  }
  function onScroll(){
    if(!pdf)return;
    var tp=Math.round(Math.max(root.scrollTop||0,body.scrollTop||0)),h=Math.max(root.scrollHeight||0,body.scrollHeight||0),c=root.clientHeight||0;
    if(tp!=lt||h!=lh||c!=lc){lt=tp;lh=h;lc=c;post('s|'+tp+'|'+h+'|'+c);}
    if(mode==='scroll'){var p=currentPageFromScroll();if(p!==curPage){curPage=p;kick();}}
    updateIndicators();
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  setInterval(onScroll,300);

  /* zoom / fit / modes / rotate */
  function zoomTo(z){
    z=Math.max(0.3,Math.min(5,z));if(Math.abs(z-userZoom)<0.001)return;
    var keep=curPage;userZoom=z;store('pdfZoom',String(z));post('z|'+z.toFixed(2));
    layout();if(mode==='scroll')goto(keep);

      setTimeout(function(){settled=true;tryReveal();},start>1?700:200);
      setTimeout(function(){tryReveal(true);},3500);
      onScroll();
    }).catch(function(err){
      if(Q.coveronly==='1'){post('cverr');return;}
      if(err&&err.name==='PasswordException')return;
      showMsg('<div>'+T.err+'</div><div style="opacity:.6;font-size:12px;direction:ltr">'+String(err&&err.message||err).replace(/</g,'&lt;')+'</div>');
    });
  }
  open();
})();
</script>
</body>
</html>
